<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Brasilit Vistorias</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }
    
    .offline-container {
      max-width: 400px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .logo {
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    
    .retry-btn {
      background: #EE1B24;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .retry-btn:hover {
      background: #c41520;
      transform: translateY(-2px);
    }
    
    .features {
      margin-top: 2rem;
      text-align: left;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    .features ul {
      list-style: none;
      padding: 0;
    }
    
    .features li {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
      position: relative;
    }
    
    .features li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #4CAF50;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="logo">
      <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 0H40C53.2548 0 60 6.74515 60 20C60 33.2548 53.2548 40 40 40H20C6.74515 40 0 33.2548 0 20C0 6.74515 6.74515 0 20 0Z" fill="white"/>
        <path d="M80 0H100C113.255 0 120 6.74515 120 20C120 33.2548 113.255 40 100 40H80C66.7452 40 60 33.2548 60 20C60 6.74515 66.7452 0 80 0Z" fill="white"/>
        <text x="15" y="25" font-family="Arial" font-size="16" font-weight="700" fill="#EE1B24">BRASI</text>
        <text x="75" y="25" font-family="Arial" font-size="16" font-weight="700" fill="#EE1B24">LIT</text>
      </svg>
    </div>
    
    <h1>Você está offline</h1>
    <p>Não foi possível conectar-se à internet. Verifique sua conexão e tente novamente.</p>
    
    <button class="retry-btn" onclick="window.location.reload()">
      Tentar Novamente
    </button>
    
    <div class="features">
      <p><strong>Funcionalidades disponíveis offline:</strong></p>
      <ul>
        <li>Visualizar vistorias salvas</li>
        <li>Continuar vistorias em rascunho</li>
        <li>Acessar dados de clientes</li>
        <li>Ver relatórios anteriores</li>
      </ul>
    </div>
  </div>
  
  <script>
    // Verificar conectividade periodicamente
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 3000);
    
    // Escutar evento de volta online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
